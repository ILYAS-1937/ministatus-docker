name: Docker CI
on:
push:
branches: [main]
tags: ["v*"]
pull_request:
branches: [main]
env:
IMAGE: ministatus
jobs:
build-scan:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Lint du Dockerfile
uses: hadolint/hadolint-action@v3.1.0
with:
dockerfile: Dockerfile
failure-threshold: warning
- name: Build de l'image
run: docker build --build-arg APP_VERSION=ci -t ${{ env.IMAGE }}:ci .
- name: Tests dans le conteneur
run: docker run --rm ${{ env.IMAGE }}:ci python -m unittest -v